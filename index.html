<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Join Bamboo Supply Co., a Foxhole regiment.">
  <meta name="theme-color" content="#14251c">
  <title>Join BSC | Bamboo Supply Co.</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 24px; background: radial-gradient(ellipse at top, #294533 0%, #14251c 55%, #0d1811 100%); color: #f4f6ed; }
    main { width: min(100%, 460px); padding: clamp(28px, 7vw, 48px); text-align: center; border: 1px solid #536953; border-radius: 18px; background: #142119ee; box-shadow: 0 24px 70px #0007; }
    .eyebrow { color: #a8c49b; font-size: .78rem; font-weight: 800; letter-spacing: .24em; text-transform: uppercase; }
    h1 { margin: 14px 0 8px; font-size: clamp(2rem, 7vw, 2.8rem); line-height: 1.13; }
    p { margin: 0 0 32px; color: #c2cdbf; line-height: 1.6; }
    .actions { display: grid; gap: 13px; }
    a { display: block; padding: 16px 22px; border-radius: 10px; text-decoration: none; font-weight: 800; font-size: 1.05rem; transition: transform .15s ease, background .15s ease; }
    a:hover { transform: translateY(-2px); }
    a:focus-visible { outline: 3px solid #f3db84; outline-offset: 4px; }
    .yes { background: #b4d88a; color: #142319; }
    .yes:hover { background: #c5e79e; }
    .no { background: transparent; color: #e8eee4; border: 1px solid #657762; }
    .no:hover { background: #263729; }
    footer { margin-top: 28px; color: #8caa87; font-size: .77rem; letter-spacing: .09em; }
    @media (prefers-reduced-motion: reduce) { a { transition: none; } a:hover { transform: none; } }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Bamboo Supply Co.</div>
    <h1>Want to join BSC?</h1>
    <p>Join our Foxhole regiment on Discord.</p>
    <div class="actions">
      <a class="yes" href="https://discord.gg/E2gFjJBUbz">YES — JOIN BSC</a>
      <a class="no" href="https://www.google.com/">NO — TAKE ME AWAY</a>
    </div>
    <footer>BAMBOO SUPPLY CO. · FOXHOLE</footer>
  </main>
</body>
</html>

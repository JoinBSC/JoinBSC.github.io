<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Join Bamboo Supply Co. on Discord." />
  <title>Join BSC</title>
  <style>
    :root {
      --page-bg: #11100d;
      --hover: rgba(196, 223, 132, 0.28);
      --hover-outline: rgba(220, 237, 160, 0.9);
      --poster-min-width: 1080px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--page-bg);
      min-height: 100%;
      width: 100%;
      font-family: Arial, Helvetica, sans-serif;
      overflow: auto;
    }

    body {
      min-width: min(100%, var(--poster-min-width));
    }

    .stage {
      width: 100%;
      min-width: var(--poster-min-width);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 0;
    }

    .poster-wrap {
      position: relative;
      width: min(100vw, 1408px);
      min-width: var(--poster-min-width);
      line-height: 0;
      flex: 0 0 auto;
    }

    .poster {
      display: block;
      width: 100%;
      height: auto;
      user-select: none;
      -webkit-user-drag: none;
    }

    .hotspot {
      position: absolute;
      display: block;
      border-radius: 16px;
      text-decoration: none;
      outline: none;
      background: transparent;
      transition: background 0.2s ease, box-shadow 0.2s ease;
    }

    .hotspot:hover,
    .hotspot:focus-visible {
      background: var(--hover);
      box-shadow: 0 0 0 2px var(--hover-outline) inset;
    }

    .join-btn {
      left: 47.45%;
      top: 55.65%;
      width: 29.0%;
      height: 7.45%;
    }

    .leave-btn {
      left: 47.45%;
      top: 64.15%;
      width: 29.0%;
      height: 7.0%;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body>
  <main class="stage">
    <section class="poster-wrap" id="posterWrap" aria-label="Bamboo Supply Co. recruitment poster">
      <img class="poster" id="posterImage" src="poster.png" alt="Bamboo Supply Co. Foxhole recruitment poster with join options on a blackboard." />

      <a class="hotspot join-btn" href="https://discord.gg/E2gFjJBUbz" aria-label="Join BSC Discord server">
        <span class="sr-only">YES — JOIN BSC</span>
      </a>

      <a class="hotspot leave-btn" href="https://www.google.com" aria-label="Leave this page and go to Google">
        <span class="sr-only">NO — TAKE ME AWAY</span>
      </a>
    </section>
  </main>

  <script>
    (function () {
      const posterWrap = document.getElementById('posterWrap');
      const posterImage = document.getElementById('posterImage');
      let userMoved = false;

      function markUserMoved() {
        userMoved = true;
      }

      window.addEventListener('scroll', markUserMoved, { passive: true, once: true });
      window.addEventListener('touchstart', markUserMoved, { passive: true, once: true });
      window.addEventListener('wheel', markUserMoved, { passive: true, once: true });

      function focusBlackboard(force) {
        if (!posterWrap || !posterImage) return;
        if (userMoved && !force) return;

        const rect = posterWrap.getBoundingClientRect();
        const pageX = window.scrollX || window.pageXOffset;
        const pageY = window.scrollY || window.pageYOffset;
        const posterLeft = rect.left + pageX;
        const posterTop = rect.top + pageY;
        const posterWidth = posterWrap.offsetWidth;
        const posterHeight = posterImage.offsetHeight || posterWrap.offsetHeight;

        if (!posterWidth || !posterHeight) return;

        // Blackboard center based on poster proportions.
        const targetCenterX = posterLeft + posterWidth * 0.62;
        const targetCenterY = posterTop + posterHeight * 0.47;

        let targetX = targetCenterX - (window.innerWidth * 0.5);
        let targetY = targetCenterY - (window.innerHeight * 0.38);

        const maxX = Math.max(0, document.documentElement.scrollWidth - window.innerWidth);
        const maxY = Math.max(0, document.documentElement.scrollHeight - window.innerHeight);

        targetX = Math.max(0, Math.min(targetX, maxX));
        targetY = Math.max(0, Math.min(targetY, maxY));

        window.scrollTo({ left: targetX, top: targetY, behavior: force ? 'auto' : 'smooth' });
      }

      function initFocus() {
        focusBlackboard(true);
      }

      if (posterImage.complete) {
        initFocus();
      } else {
        posterImage.addEventListener('load', initFocus, { once: true });
      }

      window.addEventListener('resize', function () {
        if (!userMoved) {
          focusBlackboard(true);
        }
      });
    })();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Join Bamboo Supply Co. on Discord." />
  <title>Join BSC</title>
  <style>
    :root {
      --page-bg: #11100d;
      --hover: rgba(196, 223, 132, 0.28);
      --hover-outline: rgba(220, 237, 160, 0.9);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--page-bg);
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .poster-wrap {
      position: relative;
      width: min(100vw, 1408px);
      line-height: 0;
    }

    .poster {
      display: block;
      width: 100%;
      height: auto;
    }

    .hotspot {
      position: absolute;
      display: block;
      border-radius: 16px;
      text-decoration: none;
      outline: none;
      background: transparent;
      transition: background 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
    }

    .hotspot:hover,
    .hotspot:focus-visible {
      background: var(--hover);
      box-shadow: 0 0 0 4px var(--hover-outline), 0 0 24px rgba(0,0,0,0.45) inset;
    }

    .join-btn {
      left: 47.4%;
      top: 57.45%;
      width: 29.1%;
      height: 7.6%;
    }

    .leave-btn {
      left: 47.4%;
      top: 66.2%;
      width: 29.1%;
      height: 7.5%;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body>
  <main class="poster-wrap" aria-label="Bamboo Supply Co. recruitment poster">
    <img class="poster" src="poster.png" alt="Bamboo Supply Co. Foxhole recruitment poster with join options on a blackboard." />

    <a class="hotspot join-btn" href="https://discord.gg/E2gFjJBUbz" aria-label="Join BSC Discord server">
      <span class="sr-only">YES — JOIN BSC</span>
    </a>

    <a class="hotspot leave-btn" href="https://www.google.com" aria-label="Leave this page and go to Google">
      <span class="sr-only">NO — TAKE ME AWAY</span>
    </a>
  </main>
</body>
</html>
